
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f59e0b">
  <title>Reset Password - Eagle Token</title>
  <link rel="stylesheet" href="app.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reset-container {
      width: 100%;
      max-width: 420px;
    }
    .reset-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .reset-logo .logo-circle {
      margin: 0 auto 14px;
    }
    #newPassword, #confirmPassword {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
    }
    #resetMessage {
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <main class="reset-container">
    <div class="reset-logo">
      <div class="logo-circle">🦅</div>
      <h1>Eagle Token</h1>
      <p style="color:var(--text-secondary);">Mining Network</p>
    </div>

    <div class="card card-lg">
      <h2 style="margin-top:0;">Create a New Password</h2>
      <p style="color:var(--text-secondary);font-size:13px;line-height:1.6;">
        Enter your new password below.
      </p>

      <div id="resetMessage" role="status" aria-live="polite"></div>

      <form id="resetForm">
        <input
          id="newPassword"
          type="password"
          placeholder="New password (minimum 8 characters)"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <input
          id="confirmPassword"
          type="password"
          placeholder="Confirm new password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button
          id="savePasswordBtn"
          type="submit"
          class="btn btn-primary"
          style="width:100%;padding:12px;margin-top:8px;">
          Update Password
        </button>
      </form>

      <a
        href="./index.html"
        class="btn btn-secondary"
        style="display:block;text-align:center;text-decoration:none;padding:12px;margin-top:12px;">
        Back to Login
      </a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
  <script src="/shared.js"></script>

  <script>
    const form = document.getElementById("resetForm");
    const passwordInput = document.getElementById("newPassword");
    const confirmInput = document.getElementById("confirmPassword");
    const button = document.getElementById("savePasswordBtn");
    const message = document.getElementById("resetMessage");

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.color = success ? "#22c55e" : "#ef4444";
    }

    let recoverySessionReady = false;

    async function initializeRecovery() {
      try {
        await window.EagleReady;

        // Supabase JS handles the recovery URL and PKCE callback.
        const { data, error } =
          await window.Eagle.supabase.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          recoverySessionReady = false;
          showMessage(
            "This password reset link is invalid, expired, or has already been used. Request a new link."
          );
          button.disabled = true;
          return;
        }

        recoverySessionReady = true;

      } catch (error) {
        console.error("Recovery initialization failed:", error);
        showMessage(
          "Unable to verify this reset link. Please request a new one."
        );
        button.disabled = true;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoverySessionReady) {
        showMessage("Your reset session is not valid. Request a new link.");
        return;
      }

      const password = passwordInput.value;
      const confirmation = confirmInput.value;

      if (password.length < 8) {
        showMessage("Your password must contain at least 8 characters.");
        return;
      }

      if (password !== confirmation) {
        showMessage("The passwords do not match.");
        return;
      }

      button.disabled = true;
      button.textContent = "Updating...";

      try {
        const { error } =
          await window.Eagle.supabase.auth.updateUser({
            password: password
          });

        if (error) throw error;

        showMessage(
          "Your password has been updated successfully. You can now log in with your new password.",
          true
        );

        form.reset();

        // End the recovery session after a successful password change.
        await window.Eagle.signOut();

        button.textContent = "Password Updated";

      } catch (error) {
        console.error("Password update failed:", error);
        showMessage(
          error.message || "Unable to update your password. Request a new link if necessary."
        );
        button.disabled = false;
        button.textContent = "Update Password";
      }
    });

    initializeRecovery();
  </script>
</body>
</html>
