<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verify Email — Eagle Token</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/app.css">
<style>
  .verify-shell {
    max-width: 420px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
  }
  .verify-icon {
    width: 72px; height: 72px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin-bottom: 20px;
  }
  .verify-icon.pending { background: rgba(255,255,255,0.06); border: 1px solid var(--card-border); }
  .verify-icon.success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.35); color: var(--success); }
  .verify-icon.error   { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); color: var(--error); }
  .verify-title { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
  .verify-desc  { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 24px; max-width: 320px; }
  .verify-spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--card-border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .verify-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }
  .verify-actions .btn { padding: 13px; text-decoration: none; display: block; }
</style>
</head>
<body>

<div class="verify-shell">

  <div class="logo-circle" style="width:56px;height:56px;font-size:26px;margin-bottom:20px;">🦅</div>

  <div id="statePending">
    <div class="verify-icon pending"><div class="verify-spinner"></div></div>
    <div class="verify-title">Verifying your email…</div>
    <div class="verify-desc">Hang tight, this only takes a second.</div>
  </div>

  <div id="stateSuccess" class="hidden">
    <div class="verify-icon success">✓</div>
    <div class="verify-title">Email verified</div>
    <div class="verify-desc">Your account is active. Head back to Eagle Token to start mining.</div>
    <div class="verify-actions">
      <a class="btn btn-primary" href="/">Open Eagle Token</a>
    </div>
  </div>

  <div id="stateError" class="hidden">
    <div class="verify-icon error">!</div>
    <div class="verify-title" id="errorTitle">Verification failed</div>
    <div class="verify-desc" id="errorDesc">This link is invalid or has expired.</div>
    <div class="verify-actions">
      <a class="btn btn-primary" href="/">Back to Eagle Token</a>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./shared.js"></script>

<script>
  const pendingEl    = document.getElementById("statePending");
  const successEl    = document.getElementById("stateSuccess");
  const errorEl      = document.getElementById("stateError");
  const errorTitleEl = document.getElementById("errorTitle");
  const errorDescEl  = document.getElementById("errorDesc");

  function showError(title, desc) {
    pendingEl.classList.add("hidden");
    errorTitleEl.textContent = title;
    errorDescEl.textContent = desc;
    errorEl.classList.remove("hidden");
  }

  function showSuccess() {
    pendingEl.classList.add("hidden");
    successEl.classList.remove("hidden");
  }

  let attempted = false;

  (async () => {
    if (attempted) return;
    attempted = true;

    try {
      // Wait until config.js and shared.js have initialized the Supabase client.
      const eagle = await window.EagleReady;
      const supabase = eagle?.supabase;

      if (!supabase?.auth?.verifyOtp) {
        throw new Error("Supabase authentication is not available.");
      }

      const params = new URLSearchParams(window.location.search);

      // Supabase may redirect an authentication error back to this page.
      const redirectError = params.get("error_description") || params.get("error");
      if (redirectError) {
        showError(
          "Verification failed",
          redirectError.replace(/\+/g, " ")
        );
        return;
      }

      const tokenHash = params.get("token_hash");
      const type = params.get("type");

      if (!tokenHash || !type) {
        showError(
          "Invalid verification link",
          "This link is missing its Supabase verification details. Request a new verification email from the app."
        );
        return;
      }

      // Only accept email-verification OTP types on this page.
      if (type !== "signup" && type !== "email") {
        showError(
          "Invalid verification link",
          "This link is not an email-signup verification link. Please use the correct email from Eagle Mining."
        );
        return;
      }

      const { data, error } = await supabase.auth.verifyOtp({
        token_hash: tokenHash,
        type
      });

      if (error) {
        console.error("[verify] Supabase verifyOtp failed:", error.message);

        const message = (error.message || "").toLowerCase();

        if (message.includes("expired") || message.includes("invalid")) {
          showError(
            "Link invalid or expired",
            "This verification link is invalid, expired, or has already been used. Request a new verification email from the app."
          );
        } else {
          showError(
            "Verification failed",
            error.message || "Supabase could not verify this email. Please try again."
          );
        }
        return;
      }

      if (data?.user || data?.session) {
        showSuccess();
      } else {
        showError(
          "Verification incomplete",
          "Supabase did not confirm the account. Please request a new verification email."
        );
      }
    } catch (err) {
      console.error("[verify] Initialization failed:", err);
      showError(
        "Configuration failed",
        err?.message || "Could not initialize Eagle Mining authentication. Check your connection and try again."
      );
    }
  })();
</script>
</body>
</html>
