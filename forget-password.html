
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f59e0b">
  <meta name="description" content="Reset your Eagle Token account password">

  <title>Forgot Password - Eagle Token</title>

  <link rel="stylesheet" href="app.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .reset-container {
      width: 100%;
      max-width: 420px;
    }

    .reset-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .reset-logo .logo-circle {
      margin: 0 auto 14px;
    }

    .reset-logo h1 {
      font-size: 24px;
      margin: 0 0 8px;
    }

    .reset-logo p {
      color: var(--text-secondary);
      margin: 0;
    }

    #resetEmail {
      width: 100%;
      padding: 13px;
      margin: 12px 0;
    }

    #resetMessage {
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>

  <main class="reset-container">

    <div class="reset-logo">
      <div class="logo-circle">🦅</div>
      <h1>Eagle Token</h1>
      <p>Mining Network</p>
    </div>

    <div class="card card-lg">

      <h2 style="margin-top:0;">Forgot Password?</h2>

      <p style="color:var(--text-secondary);font-size:13px;line-height:1.6;">
        Enter the email address associated with your Eagle Token account.
        We will send you a link to reset your password.
      </p>

      <div id="resetMessage" role="status" aria-live="polite"></div>

      <form id="forgotPasswordForm">

        <label for="resetEmail"
          style="font-size:13px;color:var(--text-secondary);">
          Email address
        </label>

        <input
          id="resetEmail"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <button
          id="resetButton"
          type="submit"
          class="btn btn-primary"
          style="width:100%;padding:12px;margin-top:8px;">
          Send Reset Link
        </button>

      </form>

      <a
        href="./index.html"
        class="btn btn-secondary"
        style="display:block;text-align:center;text-decoration:none;padding:12px;margin-top:12px;">
        Back to Login
      </a>

    </div>

  </main>

  <!-- Supabase JS SDK must load before config.js and shared.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
  <script src="/shared.js"></script>

  <script>
    const form = document.getElementById("forgotPasswordForm");
    const emailInput = document.getElementById("resetEmail");
    const resetButton = document.getElementById("resetButton");
    const message = document.getElementById("resetMessage");

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.color = success ? "#22c55e" : "#ef4444";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        showMessage("Please enter your email address.");
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = "Sending...";
      message.textContent = "";

      try {
        await window.EagleReady;

        const { error } =
          await window.Eagle.supabase.auth.resetPasswordForEmail(email, {
            redirectTo: `${window.location.origin}/reset-password.html`
          });

        if (error) {
          throw error;
        }

        showMessage(
          "If an account exists for that email, a password reset link will be sent. Please check your inbox and spam folder.",
          true
        );

        form.reset();

      } catch (error) {
        console.error("Password reset request failed:", error);

        showMessage(
          error.message || "Unable to send the reset email. Please try again."
        );

      } finally {
        resetButton.disabled = false;
        resetButton.textContent = "Send Reset Link";
      }
    });
  </script>

</body>
</html>
